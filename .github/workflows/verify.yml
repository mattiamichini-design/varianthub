name: Verify site and installable packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep 'favorites move|hero can be reentered|save failure details'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run test:runner
      - run: npm run audit:history
      - run: npm run verify:packages
      - run: npm run build
      - run: npm run test:e2e -- --grep-invert 'favorites move|hero can be reentered|save failure details'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: output/playwright/
          retention-days: 7
