name: Bug report
description: Something in the runner, the viewer or the website does not work as described.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the relevant part of `varianthub.config.json` if the problem involves a project.
      placeholder: |
        1. Run `node packages/runner/src/cli.mjs start --root ...`
        2. Open ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Local runner (HTML/URL projects)
        - React viewer (varianthub-core)
        - Agent skills
        - Website or playground
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system, browser and the VariantHub commit you are on.
      placeholder: Node 22.12, macOS 15, Chrome 141, commit abc1234
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Terminal output, browser console errors or screenshots, if any.
